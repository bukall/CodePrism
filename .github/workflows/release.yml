name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  core-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install core
        run: pip install -e ./core
      - name: Unit tests
        run: python -m unittest discover -s core/tests -v

  package-extension:
    needs: core-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sync bundled engine
        run: node vscode-extension/scripts/sync-core.mjs
      - name: Vendor runtime dependencies
        run: python scripts/prepare-vendor.py
      - name: Install and build
        working-directory: vscode-extension
        run: |
          npm ci
          npm run compile
      - name: Package vsix
        working-directory: vscode-extension
        run: npx vsce package -o codeprism.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: codeprism-vsix
          path: vscode-extension/codeprism.vsix
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: vscode-extension/codeprism.vsix

  publish-marketplace:
    needs: package-extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: codeprism-vsix
      - name: Publish to VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "VSCE_PAT not configured - skipping Marketplace publish."
            exit 0
          fi
          npx --yes @vscode/vsce publish --packagePath codeprism.vsix --pat "$VSCE_PAT"

  publish-openvsx:
    needs: package-extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: codeprism-vsix
      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo "OVSX_PAT not configured - skipping Open VSX publish."
            exit 0
          fi
          npx --yes ovsx publish codeprism.vsix --pat "$OVSX_PAT"
