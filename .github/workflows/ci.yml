name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# 连续 push 会并行跑满 3x3 核心矩阵 + 3 平台扩展腿；同一 ref 只保留最新
# 一次运行，取消仍在进行的上一次（不影响 matrix 内部 fail-fast: false）。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.12", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install core
        run: pip install -e ./core
      - name: Unit tests
        run: python -m unittest discover -s core/tests -v

  extension-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: VS Code runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libasound2 libgtk-3-0 libnss3 libxss1 libgbm1 libdrm2 libcups2 libatk-bridge2.0-0 libatk1.0-0 libx11-xcb1 libxcomposite1 libxdamage1 libxrandr2 libpango-1.0-0 libcairo2
      - name: Vendor pins satisfy library ranges
        run: |
          python -m pip install packaging
          python scripts/check-vendor-pins.py
      - name: Install dependencies
        working-directory: vscode-extension
        run: npm ci
      - name: Integration tests (Linux, real VS Code)
        if: runner.os == 'Linux'
        working-directory: vscode-extension
        run: xvfb-run -a npm run test:integration
      - name: Integration tests (Windows, real VS Code)
        if: runner.os == 'Windows'
        working-directory: vscode-extension
        run: npm run test:integration
      - name: Integration tests (macOS, real VS Code)
        if: runner.os == 'macOS'
        working-directory: vscode-extension
        run: npm run test:integration

  # The lower bounds in core/pyproject.toml are a contract: pathspec 1.0.0 is
  # the first release with the "simple" backend the scanner relies on. A job
  # pinned to every minimum catches an accidental bound relaxation immediately.
  core-min-deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10"
      - name: Install core with minimum supported dependencies
        run: pip install -e ./core "pathspec==1.0.0" "binaryornot==0.6.0" "chardet==5.2.0" "click==8.0.0" "pyperclip==1.8.0"
      - name: Unit tests
        run: python -m unittest discover -s core/tests -v
